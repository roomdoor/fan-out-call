name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# main에 연속으로 푸시되면 두 런이 겹치고, 늦게 끝난 쪽이 latest를 가져간다.
# 순서가 뒤집히면 latest가 더 오래된 커밋을 가리킬 수 있어 앞선 런을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      # PR에서는 이미지를 밀지 않는다. 빌드가 되는지만 확인한다.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # linux/amd64 단일 아키텍처는 의도된 선택이다. 측정 인스턴스를 x86(c7i 계열)으로
      # 확정했고, arm64 이미지를 만들어 에뮬레이션으로 돌리면 JVM 기동과 스케줄링이
      # 왜곡되어 처리량 측정값이 오염된다. 멀티아치 빌드를 추가하지 말 것.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
